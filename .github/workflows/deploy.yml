name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
    deploy:
       runs-on: ubuntu-latest

       steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup SSH key
          run:
            mkdikr -p ~/.ssh
            echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy-key.pem
            chmod 600 ~/.ssh/deploy-key.pem

        - name: Add EC2 to known hosts
          run: |
              ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

        - name: Copy files to EC2
          run: |
               scp -i ~/.ssh/deploy-key.pem \
                 -r index.html style.css script.js \
                 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/

        - name: Start web server on EC2
          run: |
               ssh -i ~/.ssh/deploy-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
                 pkill -f "python3 -m http.server" || true
                 cd ~
                 nohup python3 -m http.server 8000 > /dev/null 2>&1&
                 echo "web server started on port 8000"
               EOF
